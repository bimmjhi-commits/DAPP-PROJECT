
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#050811" />
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer Cyber Hexagon / Shield -->
  <g filter="url(#glow)">
    <polygon points="256,60 410,135 410,320 256,440 102,320 102,135" 
      fill="none" stroke="url(#cyberGrad)" stroke-width="12" stroke-linejoin="round" />
  </g>
  
  <!-- Inner Shield Fill -->
  <polygon points="256,80 390,145 390,305 256,415 122,305 122,145" 
    fill="url(#neonGlow)" />
  
  <!-- Circuit Nodes & Grid lines -->
  <line x1="256" y1="80" x2="256" y2="170" stroke="#00F0FF" stroke-width="4" stroke-dasharray="6,6" />
  <line x1="122" y1="225" x2="200" y2="225" stroke="#00F0FF" stroke-width="4" />
  <line x1="390" y1="225" x2="312" y2="225" stroke="#00F0FF" stroke-width="4" />
  <circle cx="200" cy="225" r="5" fill="#00F0FF" />
  <circle cx="312" cy="225" r="5" fill="#00F0FF" />

  <!-- DAPP Stylized Emblem -->
  <!-- D Glyph / Cyber D -->
  <path d="M 190 190 L 260 190 C 295 190 320 215 320 256 C 320 297 295 322 260 322 L 190 322 Z" 
    fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 190 225 L 245 225 C 265 225 278 238 278 256 C 278 274 265 287 245 287 L 190 287 Z" 
    fill="#00F0FF" />

  <!-- Text DAPP -->
  <text x="256" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#00F0FF" letter-spacing="8">DAPP</text>
  <text x="256" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#6B7280" letter-spacing="4">SECURITY TOOLS</text>
</svg>
